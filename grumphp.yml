grumphp:
  tasks:
    composer: null

    git_blacklist:
      keywords:
        - "dump("
        - "var_dump("
        - "print_r("
        - "die("
        - "exit("
        - "exit;"

    git_commit_message:
      max_subject_width: 72
      max_body_width: 100
      enforce_capitalized_subject: false
      type_scope_conventions:
        types:
          - build
          - ci
          - chore
          - docs
          - feat
          - fix
          - perf
          - refactor
          - revert
          - style
          - test
        scopes: [ ]

    composer_script:
      triggered_by: [php, phtml]
      script: test:yaml

    composer_script_twig:
      triggered_by: [php, phtml]
      script: test:twig
      metadata:
        task: composer_script

    phpcsfixer:
      config: '.php-cs-fixer.dist.php'

    phpstan:
      configuration: ~

  fixer:
    enabled: false
    fix_by_default: false