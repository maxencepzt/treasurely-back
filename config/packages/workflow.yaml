framework:
    workflows:
      treasure_hunt_workflow:
        # Une chasse n'est jamais dans deux états à la fois : machine à états, marquage
        # stocké tel quel dans la chaîne TreasureHunt::$status.
        type: 'state_machine'
        audit_trail:
          enabled: true
        marking_store:
          type: 'method'
          property: 'status'
        supports:
          - App\Entity\TreasureHunt
        initial_marking: !php/const App\Entity\TreasureHunt::STATE_DRAFT
        places:
          - !php/const App\Entity\TreasureHunt::STATE_DRAFT
          - !php/const App\Entity\TreasureHunt::STATE_OPENED
          - !php/const App\Entity\TreasureHunt::STATE_CLOSED
        transitions:
          publish:
            from: !php/const App\Entity\TreasureHunt::STATE_DRAFT
            to: !php/const App\Entity\TreasureHunt::STATE_OPENED
          close:
            from: !php/const App\Entity\TreasureHunt::STATE_OPENED
            to:   !php/const App\Entity\TreasureHunt::STATE_CLOSED
          republish:
            from: !php/const App\Entity\TreasureHunt::STATE_CLOSED
            to: !php/const App\Entity\TreasureHunt::STATE_OPENED
